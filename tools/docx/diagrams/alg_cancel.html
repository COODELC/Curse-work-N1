<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
 html,body{margin:0;padding:0;background:#fff;}
 #root{position:relative;width:1250px;height:700px;font-family:"Segoe UI",Arial,sans-serif;background:#fff;}
 .n{position:absolute;background:#fff;border:1.7px solid #1F2937;text-align:center;font-size:16px;line-height:1.25;padding:8px 12px;border-radius:4px;box-sizing:border-box;}
 .term{border-radius:20px;background:#EFF6FF;}
 .io{border-radius:20px;background:#ECFDF5;}
 .proc{background:#FEF3C7;}
 .dec{background:#FCE7F3;}
 .opp{background:#FEE2E2;}
 .lab{position:absolute;font-size:15px;color:#374151;text-align:center;white-space:nowrap;}
 svg{position:absolute;left:0;top:0;}
</style>
</head>
<body>
<div id="root">
<svg width="1250" height="700">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#374151" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- основной поток -->
  <line x1="560" y1="60"  x2="560" y2="100"  stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="560" y1="144" x2="560" y2="186"  stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="560" y1="242" x2="560" y2="316"  stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="560" y1="372" x2="560" y2="430"  stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="560" y1="474" x2="560" y2="524"  stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="560" y1="568" x2="560" y2="608"  stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ветви «выход» -->
  <line x1="710" y1="214" x2="830" y2="214" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="710" y1="344" x2="830" y2="344" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
</svg>

<!-- основной поток -->
<div class="n term" style="left:460px;top:20px;width:200px;height:40px;">Начало</div>
<div class="n io"  style="left:410px;top:100px;width:300px;height:44px;">Идентификатор заказа</div>
<div class="n dec" style="left:410px;top:186px;width:300px;height:56px;">Заказ найден?</div>
<div class="n dec" style="left:410px;top:316px;width:300px;height:56px;">Уже отменён?</div>
<div class="n proc" style="left:310px;top:430px;width:500px;height:44px;">Возврат единицы товара на склад, статус «Отменён»</div>
<div class="n io"  style="left:410px;top:524px;width:300px;height:44px;">Результат true</div>
<div class="n term" style="left:460px;top:608px;width:200px;height:40px;">Конец</div>

<!-- ветви выхода -->
<div class="n opp" style="left:830px;top:188px;width:350px;height:52px;">Исключение «Заказ не найден»</div>
<div class="n opp" style="left:830px;top:318px;width:350px;height:52px;">Возврат false, товар не возвращается</div>

<!-- подписи -->
<div class="lab" style="left:730px;top:188px;">нет</div>
<div class="lab" style="left:572px;top:252px;">да</div>
<div class="lab" style="left:730px;top:318px;">да</div>
<div class="lab" style="left:572px;top:382px;">нет</div>
</div>
</body>
</html>
